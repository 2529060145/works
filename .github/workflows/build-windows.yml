name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test portable database backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run tauri:build -- --bundles nsis

      - name: Prepare portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/app.exe portable/job-manager-portable.exe

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: job-manager-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/job-manager-portable.exe
          if-no-files-found: error
